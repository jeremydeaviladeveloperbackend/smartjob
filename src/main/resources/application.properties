spring.application.name=smartjob
spring.datasource.url=jdbc:hsqldb:mem:registro_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=123456

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
# Configuración de paquetes a escanear (opcional, SpringDoc escanea automáticamente)
# springdoc.packages-to-scan=org.smartjob.controller
# springdoc.paths-to-match=/**